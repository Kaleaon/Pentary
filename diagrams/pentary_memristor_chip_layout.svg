<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .title { font: 28px 'Arial', sans-serif; fill: #1a1a1a; font-weight: 700; }
    .label { font: 16px 'Arial', sans-serif; fill: #1a1a1a; }
    .small { font: 14px 'Arial', sans-serif; fill: #1a1a1a; }
    .outline { fill: #ffffff; stroke: #1a1a1a; stroke-width: 4; }
    .ring { fill: #f4d1e8; stroke: #1a1a1a; stroke-width: 2; }
    .control { fill: #d7f4d0; stroke: #1a1a1a; stroke-width: 2; }
    .tile-area { fill: #e6f2ff; stroke: #1a1a1a; stroke-width: 2; }
    .tile { fill: #bcdcf5; stroke: #1a1a1a; stroke-width: 1.5; }
    .analog { fill: #ffe0b2; stroke: #1a1a1a; stroke-width: 2; }
  </style>

  <rect x="40" y="40" width="1120" height="720" rx="18" class="outline" />
  <text x="600" y="80" text-anchor="middle" class="title">Pentary Memristor Accelerator Chip (5mm × 5mm)</text>

  <rect x="90" y="110" width="1020" height="70" rx="12" class="ring" />
  <text x="600" y="152" text-anchor="middle" class="label">I/O Pad Ring (VDD · GND · CLK · SPI · ADDR · DATA · CTRL)</text>

  <rect x="140" y="200" width="920" height="90" rx="12" class="control" />
  <text x="600" y="245" text-anchor="middle" class="label">Digital Control Layer (CMOS)</text>
  <text x="600" y="268" text-anchor="middle" class="small">Config Registers · Address Decoder · FSM · Error Correction</text>

  <rect x="140" y="320" width="920" height="300" rx="12" class="tile-area" />
  <text x="600" y="350" text-anchor="middle" class="label">Memristor Crossbar Tiles (4×4 grid)</text>

  <g>
    <rect x="170" y="365" width="200" height="60" rx="8" class="tile" />
    <rect x="390" y="365" width="200" height="60" rx="8" class="tile" />
    <rect x="610" y="365" width="200" height="60" rx="8" class="tile" />
    <rect x="830" y="365" width="200" height="60" rx="8" class="tile" />

    <rect x="170" y="440" width="200" height="60" rx="8" class="tile" />
    <rect x="390" y="440" width="200" height="60" rx="8" class="tile" />
    <rect x="610" y="440" width="200" height="60" rx="8" class="tile" />
    <rect x="830" y="440" width="200" height="60" rx="8" class="tile" />

    <rect x="170" y="515" width="200" height="60" rx="8" class="tile" />
    <rect x="390" y="515" width="200" height="60" rx="8" class="tile" />
    <rect x="610" y="515" width="200" height="60" rx="8" class="tile" />
    <rect x="830" y="515" width="200" height="60" rx="8" class="tile" />

    <rect x="170" y="590" width="200" height="60" rx="8" class="tile" />
    <rect x="390" y="590" width="200" height="60" rx="8" class="tile" />
    <rect x="610" y="590" width="200" height="60" rx="8" class="tile" />
    <rect x="830" y="590" width="200" height="60" rx="8" class="tile" />
  </g>

  <g class="small">
    <text x="270" y="400" text-anchor="middle">Tile 0</text>
    <text x="490" y="400" text-anchor="middle">Tile 1</text>
    <text x="710" y="400" text-anchor="middle">Tile 2</text>
    <text x="930" y="400" text-anchor="middle">Tile 3</text>

    <text x="270" y="475" text-anchor="middle">Tile 4</text>
    <text x="490" y="475" text-anchor="middle">Tile 5</text>
    <text x="710" y="475" text-anchor="middle">Tile 6</text>
    <text x="930" y="475" text-anchor="middle">Tile 7</text>

    <text x="270" y="550" text-anchor="middle">Tile 8</text>
    <text x="490" y="550" text-anchor="middle">Tile 9</text>
    <text x="710" y="550" text-anchor="middle">Tile 10</text>
    <text x="930" y="550" text-anchor="middle">Tile 11</text>

    <text x="270" y="625" text-anchor="middle">Tile 12</text>
    <text x="490" y="625" text-anchor="middle">Tile 13</text>
    <text x="710" y="625" text-anchor="middle">Tile 14</text>
    <text x="930" y="625" text-anchor="middle">Tile 15</text>
  </g>

  <rect x="140" y="650" width="920" height="80" rx="12" class="analog" />
  <text x="600" y="695" text-anchor="middle" class="label">Analog Periphery</text>
  <text x="600" y="718" text-anchor="middle" class="small">DAC Array · ADC Array · Sample · Hold · Reference Generator</text>
</svg>
