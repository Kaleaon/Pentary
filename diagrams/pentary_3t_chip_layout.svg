<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    .title { font: 28px 'Arial', sans-serif; fill: #1a1a1a; font-weight: 700; }
    .label { font: 16px 'Arial', sans-serif; fill: #1a1a1a; }
    .small { font: 14px 'Arial', sans-serif; fill: #1a1a1a; }
    .ring { fill: #f4d1e8; stroke: #1a1a1a; stroke-width: 2; }
    .array { fill: #d5e8f6; stroke: #1a1a1a; stroke-width: 2; }
    .analog { fill: #ffe0b2; stroke: #1a1a1a; stroke-width: 2; }
    .digital { fill: #d7f4d0; stroke: #1a1a1a; stroke-width: 2; }
    .outline { fill: #ffffff; stroke: #1a1a1a; stroke-width: 4; }
  </style>

  <rect x="30" y="30" width="1140" height="700" rx="18" class="outline" />
  <text x="600" y="70" text-anchor="middle" class="title">Pentary 3T Chip Layout (334µm × 225µm)</text>

  <rect x="90" y="100" width="1020" height="70" rx="12" class="ring" />
  <text x="600" y="140" text-anchor="middle" class="label">Analog I/O Ring</text>

  <rect x="120" y="210" width="200" height="250" rx="12" class="analog" />
  <rect x="350" y="210" width="500" height="250" rx="12" class="array" />
  <rect x="880" y="210" width="200" height="250" rx="12" class="analog" />

  <text x="220" y="255" text-anchor="middle" class="label">Level Generator</text>
  <text x="220" y="280" text-anchor="middle" class="small">&amp; Reference Voltages</text>

  <text x="600" y="255" text-anchor="middle" class="label">16×16 Processing Element Array</text>
  <text x="600" y="280" text-anchor="middle" class="small">256 PEs · 240µm × 160µm</text>

  <text x="980" y="255" text-anchor="middle" class="label">Output Stage</text>
  <text x="980" y="280" text-anchor="middle" class="small">&amp; ADC</text>

  <rect x="120" y="490" width="960" height="90" rx="12" class="digital" />
  <text x="600" y="545" text-anchor="middle" class="label">Control Logic · FSM · Refresh Controller</text>

  <rect x="90" y="610" width="1020" height="70" rx="12" class="ring" />
  <text x="600" y="650" text-anchor="middle" class="label">Digital I/O Ring</text>
</svg>
